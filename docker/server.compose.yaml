# Weir .NET server (preparation for #523) — for trying docker/server.Dockerfile locally.
# This is NOT the compose file the release publishes an image for; that stays ./compose.yaml
# (the Python image) until #523 switches over. There is no published .NET image yet, so this
# file builds from source instead of pulling from GHCR.
#
# From the repo root:
#   docker compose -f docker/server.compose.yaml build
#   docker compose -f docker/server.compose.yaml up -d
#
# Open http://localhost:8788/ after the container starts.

name: weir-dotnet

services:
  weir:
    build:
      context: ../.
      dockerfile: docker/server.Dockerfile
    ports:
      - "8788:8788"
    environment:
      WEIR_HOME: ${WEIR_HOME:-/data/weir}
      # Optional UID/GID remap for the runtime account inside the container.
      # WEIR_PUID: ${WEIR_PUID:-1000}
      # WEIR_PGID: ${WEIR_PGID:-1000}
      # Optional Refiner path ownership policies for configured watched/work/output folders.
      # Not yet implemented by the .NET image — see docs/packaging-dotnet.md. Setting these logs
      # a warning and is otherwise ignored, same as leaving them unset.
      # WEIR_CHOWN_WATCHED: ${WEIR_CHOWN_WATCHED:-false}
      # WEIR_CHOWN_TEMP: ${WEIR_CHOWN_TEMP:-false}
      # WEIR_CHOWN_OUTPUT: ${WEIR_CHOWN_OUTPUT:-false}
      # WEIR_DIR_MODE_WATCHED: ${WEIR_DIR_MODE_WATCHED:-}
      # WEIR_DIR_MODE_TEMP: ${WEIR_DIR_MODE_TEMP:-}
      # WEIR_DIR_MODE_OUTPUT: ${WEIR_DIR_MODE_OUTPUT:-}
      # Optional. If omitted, the container generates and persists /data/weir/session.secret.
      # To provide your own value, generate one with: openssl rand -hex 32
      # WEIR_SESSION_SECRET: ${WEIR_SESSION_SECRET}
      # Recommended before saving Sonarr/Radarr credentials:
      # WEIR_CREDENTIALS_SECRET: ${WEIR_CREDENTIALS_SECRET}
      # Optional bearer token for Prometheus or other machine scrapes of /metrics:
      # WEIR_METRICS_BEARER_TOKEN: ${WEIR_METRICS_BEARER_TOKEN}
    volumes:
      - weir_dotnet_data:/data/weir
    restart: unless-stopped

volumes:
  weir_dotnet_data:
