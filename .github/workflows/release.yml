# Tag-driven release: push tag v* -> full validation, Windows installer, Docker image, GitHub Release.
#
# windows-smoke and validate run in parallel: validation does not need the Windows
# package, and waiting for it wasted about seven minutes of every release. publish
# needs both, so nothing reaches ghcr or the Releases page unless the installer
# built and the tests passed.
name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  windows-smoke:
    runs-on: windows-latest
    if: ${{ !contains(github.ref_name, '-') }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Normalize tag version
        id: version
        shell: bash
        run: echo "plain=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend/requirements.lock

      - name: Validate release version alignment
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          import tomllib
          from pathlib import Path

          tag_version = os.environ["TAG_VERSION"].strip()
          if tag_version.startswith("v"):
              tag_version = tag_version[1:]

          backend = tomllib.loads(Path("apps/backend/pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          web = json.loads(Path("apps/web/package.json").read_text(encoding="utf-8"))["version"]

          mismatches = []
          for name, value in [
              ("apps/backend/pyproject.toml [project].version", backend),
              ("apps/web/package.json version", web),
          ]:
              if value != tag_version:
                  mismatches.append((name, value))

          if mismatches:
              print(f"ERROR: Release tag v{tag_version} does not match versioned files:", file=sys.stderr)
              for name, value in mismatches:
                  print(f"  - {name}: {value}", file=sys.stderr)
              raise SystemExit(1)

          print(f"Release versions aligned at {tag_version}.")
          PY
        env:
          TAG_VERSION: ${{ github.ref_name }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "9.0.x"

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Install locked MediaMop backend (editable)
        run: |
          python -m pip install --require-hashes -r apps/backend/requirements.lock
          python -m pip install --no-deps --no-build-isolation -e "./apps/backend"

      - name: MediaMop web - install and build
        working-directory: apps/web
        env:
          VITE_SUPPORT_URL: ${{ vars.VITE_SUPPORT_URL }}
        run: |
          npm ci
          npm run api:types:check
          npm run build

      # FFmpeg is ~46% of this job (203.8s of 444.9s measured on v2.4.1) and the
      # vendor folder is gitignored, so every run started from nothing. The key
      # rolls per run and restores the newest previous cache; the build script
      # still checks the vendored copy against the current upstream checksum, so
      # a stale restore is refreshed rather than shipped.
      - name: Cache vendored FFmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: packaging/windows/vendor/ffmpeg
          key: ffmpeg-vendor-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ffmpeg-vendor-${{ runner.os }}-

      - name: Build MediaMop Windows package (Velopack)
        env:
          MEDIAMOP_BUILD_VERSION: ${{ steps.version.outputs.plain }}
          VITE_SUPPORT_URL: ${{ vars.VITE_SUPPORT_URL }}
        run: powershell -ExecutionPolicy Bypass -File packaging/windows/build-velopack.ps1

      - name: Smoke test packaged Windows server
        run: powershell -ExecutionPolicy Bypass -File scripts/smoke-windows-package.ps1 -ExpectedVersion "${{ steps.version.outputs.plain }}"

      - name: Generate release artifact checksums
        shell: powershell
        run: |
          $releasesDir = "dist/windows/releases"
          Get-ChildItem -Path $releasesDir -File | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Add-Content -LiteralPath (Join-Path $releasesDir "SHA256SUMS.txt") -Encoding ascii
          }

      - name: Detect Windows code signing configuration
        id: codesign
        shell: bash
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          if [[ -n "${WINDOWS_CODESIGN_PFX_BASE64}" && -n "${WINDOWS_CODESIGN_PASSWORD}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign Velopack release artifacts
        if: ${{ steps.codesign.outputs.enabled == 'true' }}
        shell: powershell
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "mediamop-codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64))
          $signtool = (Get-Command signtool.exe -ErrorAction Stop).Source
          $setupExe = Get-Item -LiteralPath "dist/windows/releases/MediaMop-win-Setup.exe" -ErrorAction Stop
          & $signtool sign /f $pfxPath /p $env:WINDOWS_CODESIGN_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $setupExe.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "signtool failed with exit code $LASTEXITCODE"
          }

      - name: Verify Velopack setup signature
        if: ${{ steps.codesign.outputs.enabled == 'true' }}
        shell: powershell
        run: |
          $setupExe = Get-Item -LiteralPath "dist/windows/releases/MediaMop-win-Setup.exe" -ErrorAction Stop
          $signature = Get-AuthenticodeSignature -FilePath $setupExe.FullName
          if ($signature.Status -ne "Valid") {
            throw "Setup signature verification failed: $($signature.Status) $($signature.StatusMessage)"
          }

      - name: Upload Velopack release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mediamop-windows-velopack
          if-no-files-found: error
          path: dist/windows/releases/*

  validate:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '-') }}
    timeout-minutes: 90
    # Deliberately no `needs`: none of this touches the Windows package, so it runs
    # while that builds instead of after it.
    permissions:
      contents: read
    env:
      MEDIAMOP_SESSION_SECRET: ${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}-release-session-secret-32chars-min
      MEDIAMOP_LIVE_E2E_FIXTURE_HOST_ROOT: ${{ runner.temp }}/mediamop-docker-release-fixture
      MEDIAMOP_LIVE_E2E_FIXTURE_SERVER_ROOT: /e2e-fixture
      MEDIAMOP_LIVE_E2E_FFMPEG: ffmpeg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend/requirements.lock

      - name: Install locked MediaMop backend and Playwright browser
        run: |
          python -m pip install --require-hashes -r apps/backend/requirements.lock
          python -m pip install --no-deps --no-build-isolation -e "./apps/backend"
          python -m playwright install --with-deps chromium

      - name: Backend dependency vulnerability scan (pip-audit)
        working-directory: apps/backend
        run: |
          python -m pip freeze --exclude-editable > pip-audit-requirements.txt
          pip-audit --strict -r pip-audit-requirements.txt
          rm pip-audit-requirements.txt

      - name: Run MediaMop backend tests
        working-directory: apps/backend
        env:
          MEDIAMOP_HOME: ${{ runner.temp }}/mediamop-ci
        run: |
          alembic upgrade head
          alembic check
          pytest -q --cov=mediamop --cov-fail-under=75

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Release publication gate ordering
        run: node scripts/check-release-workflow-gates.mjs

      - name: MediaMop web - install and unit tests
        working-directory: apps/web
        run: |
          npm ci
          npm run api:types:check
          npm run test

      - name: MediaMop web - production build
        working-directory: apps/web
        env:
          VITE_SUPPORT_URL: ${{ vars.VITE_SUPPORT_URL }}
        run: npm run build

      - name: Pack web dist
        run: |
          cd apps/web
          zip -r "$GITHUB_WORKSPACE/mediamop-web-dist.zip" dist

      - name: MediaMop E2E smoke (Playwright + real API)
        env:
          MEDIAMOP_E2E: "1"
          MEDIAMOP_HOME: ${{ runner.temp }}/mediamop-e2e
          PYTHONPATH: ${{ github.workspace }}/apps/backend/src
        run: python -m pytest tests/e2e/mediamop -q --tb=short

      - name: Upload web dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mediamop-web-dist
          if-no-files-found: error
          path: mediamop-web-dist.zip

  publish:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '-') }}
    timeout-minutes: 90
    # Both gates. Publishing on a green validation but a failed installer would put a
    # Docker image on ghcr for a release that has no Windows build.
    needs: [windows-smoke, validate]
    permissions:
      contents: write
      packages: write
    env:
      MEDIAMOP_SESSION_SECRET: ${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}-release-session-secret-32chars-min
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend/requirements.lock

      - name: Install locked live-audit dependencies and browser
        run: |
          python -m pip install --require-hashes -r apps/backend/requirements.lock
          python -m playwright install --with-deps chromium
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Download web dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mediamop-web-dist
          path: ${{ github.workspace }}

      - name: Docker image name
        id: image
        run: echo "name=${REGISTRY}/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Normalize tag version
        id: version
        run: echo "plain=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download Velopack release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mediamop-windows-velopack
          path: ${{ github.workspace }}/windows-artifact

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build unpushed Docker release candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          platforms: linux/amd64
          push: false
          tags: mediamop-release-candidate:${{ steps.version.outputs.plain }}

      - name: Start unpushed Docker release candidate
        run: |
          docker rm -f mediamop-release-candidate >/dev/null 2>&1 || true
          mkdir -p "$MEDIAMOP_LIVE_E2E_FIXTURE_HOST_ROOT"
          chmod 0777 "$MEDIAMOP_LIVE_E2E_FIXTURE_HOST_ROOT"
          docker run -d --name mediamop-release-candidate -p 8788:8788 \
            -v "$MEDIAMOP_LIVE_E2E_FIXTURE_HOST_ROOT:$MEDIAMOP_LIVE_E2E_FIXTURE_SERVER_ROOT" \
            -e MEDIAMOP_SESSION_SECRET="$MEDIAMOP_SESSION_SECRET" \
            -e MEDIAMOP_SESSION_COOKIE_SECURE=false \
            "mediamop-release-candidate:${{ steps.version.outputs.plain }}"
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8788/health >/tmp/mediamop-candidate-health.json; then
              cat /tmp/mediamop-candidate-health.json
              exit 0
            fi
            sleep 2
          done
          docker logs mediamop-release-candidate
          exit 1

      - name: Full live E2E against unpushed Docker release candidate
        env:
          MEDIAMOP_LIVE_BASE_URL: http://127.0.0.1:8788
          MEDIAMOP_LIVE_EXPECTED_VERSION: ${{ steps.version.outputs.plain }}
          MEDIAMOP_LIVE_E2E_ARTIFACTS: artifacts/docker-release-candidate-e2e
        run: python scripts/live-packaged-e2e.py

      - name: Upload Docker release-candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mediamop-docker-release-candidate-audit
          if-no-files-found: warn
          path: artifacts/docker-release-candidate-e2e/*

      - name: Cleanup unpushed Docker release candidate
        if: always()
        run: docker rm -f mediamop-release-candidate >/dev/null 2>&1 || true

      # Registry credentials and public tags are not created until the local image
      # has passed the complete packaged browser/API audit above.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.plain }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.plain }}

      - name: Verify published Docker manifest
        run: docker manifest inspect "${{ steps.image.outputs.name }}:latest"

      - name: Smoke test published Docker image
        run: |
          docker rm -f mediamop-release-smoke >/dev/null 2>&1 || true
          docker run -d --name mediamop-release-smoke -p 8788:8788 \
            -e MEDIAMOP_SESSION_SECRET="$MEDIAMOP_SESSION_SECRET" \
            -e MEDIAMOP_SESSION_COOKIE_SECURE=false \
            "${{ steps.image.outputs.name }}:latest"
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8788/health >/tmp/mediamop-health.json; then
              cat /tmp/mediamop-health.json
              exit 0
            fi
            sleep 2
          done
          docker logs mediamop-release-smoke
          exit 1

      - name: Cleanup Docker smoke container
        if: always()
        run: docker rm -f mediamop-release-smoke >/dev/null 2>&1 || true

      - name: Prepare user-facing release notes
        run: |
          notes_file="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes_file" ]; then
            echo "::error::Missing required release notes file: $notes_file"
            echo "::error::Create it from docs/release-notes/TEMPLATE.md before tagging."
            exit 1
          fi
          cp "$notes_file" "$GITHUB_WORKSPACE/release-notes.md"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            mediamop-web-dist.zip
            windows-artifact/*
          body_path: release-notes.md
