# Tag-driven release: push tag v* -> full validation, Windows installer, Docker image, GitHub Release.
#
# windows-smoke and validate run in parallel: validation does not need the Windows
# package, and waiting for it wasted about seven minutes of every release. publish
# needs both, so nothing reaches ghcr or the Releases page unless the installer
# built and the tests passed.
name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  windows-smoke:
    runs-on: windows-latest
    if: ${{ !contains(github.ref_name, '-') }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Normalize tag version
        id: version
        shell: bash
        run: echo "plain=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # The product version lives in two files: WeirVersion in apps/server/Directory.Build.props (the
      # server, installer and image) and apps/web/package.json. Both must equal the tag.
      - name: Validate release version alignment
        shell: bash
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs = require("node:fs");
          const tag = process.env.TAG_VERSION.trim().replace(/^v/, "");
          const props = fs.readFileSync("apps/server/Directory.Build.props", "utf8");
          const server = (props.match(/<WeirVersion>([^<]+)<\/WeirVersion>/) || [])[1]?.trim();
          const web = JSON.parse(fs.readFileSync("apps/web/package.json", "utf8")).version;
          const mismatches = [
            ["apps/server/Directory.Build.props WeirVersion", server],
            ["apps/web/package.json version", web],
          ].filter(([, value]) => value !== tag);
          if (mismatches.length) {
            console.error(`ERROR: Release tag v${tag} does not match versioned files:`);
            for (const [name, value] of mismatches) console.error(`  - ${name}: ${value}`);
            process.exit(1);
          }
          console.log(`Release versions aligned at ${tag}.`);
          JS

      # .NET 10 for the server (apps/server/global.json), .NET 9 for the tray app it ships with.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "9.0.x"
          global-json-file: apps/server/global.json

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.0

      # FFmpeg is ~46% of this job (203.8s of 444.9s measured on v2.4.1) and the
      # vendor folder is gitignored, so every run started from nothing. The key
      # rolls per run and restores the newest previous cache; the build script
      # still checks the vendored copy against the current upstream checksum, so
      # a stale restore is refreshed rather than shipped.
      - name: Cache vendored FFmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: packaging/windows/vendor/ffmpeg
          key: ffmpeg-vendor-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ffmpeg-vendor-${{ runner.os }}-

      # #548: same reasoning as FFmpeg above — an ~85 MB download the gitignored vendor folder would
      # otherwise repeat every run. The key carries the pinned version, so bumping
      # $mkvtoolnixVersion in build-velopack.ps1 misses the cache and downloads the new archive
      # rather than restoring the old one; the build script re-checks the vendored copy against the
      # pinned checksum either way.
      - name: Cache vendored MKVToolNix
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: packaging/windows/vendor/mkvtoolnix
          key: mkvtoolnix-vendor-${{ runner.os }}-${{ hashFiles('packaging/windows/build-velopack.ps1') }}
          restore-keys: |
            mkvtoolnix-vendor-${{ runner.os }}-

      # Builds the web app, publishes the .NET server (win-x64 single file) and the tray, vendors FFmpeg and MKVToolNix and packs.
      - name: Build Weir Windows package (Velopack)
        env:
          WEIR_BUILD_VERSION: ${{ steps.version.outputs.plain }}
          VITE_SUPPORT_URL: ${{ vars.VITE_SUPPORT_URL }}
        run: powershell -ExecutionPolicy Bypass -File packaging/windows/build-velopack.ps1

      - name: Smoke test packaged Windows server
        run: powershell -ExecutionPolicy Bypass -File scripts/smoke-windows-package.ps1 -ExpectedVersion "${{ steps.version.outputs.plain }}"

      - name: Detect Windows code signing configuration
        id: codesign
        shell: bash
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          if [[ -n "${WINDOWS_CODESIGN_PFX_BASE64}" && -n "${WINDOWS_CODESIGN_PASSWORD}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign Velopack release artifacts
        if: ${{ steps.codesign.outputs.enabled == 'true' }}
        shell: powershell
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "weir-codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64))
          $signtool = (Get-Command signtool.exe -ErrorAction Stop).Source
          $setupExe = Get-Item -LiteralPath "dist/windows/releases/Weir-win-Setup.exe" -ErrorAction Stop
          & $signtool sign /f $pfxPath /p $env:WINDOWS_CODESIGN_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $setupExe.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "signtool failed with exit code $LASTEXITCODE"
          }

      - name: Verify Velopack setup signature
        if: ${{ steps.codesign.outputs.enabled == 'true' }}
        shell: powershell
        run: |
          $setupExe = Get-Item -LiteralPath "dist/windows/releases/Weir-win-Setup.exe" -ErrorAction Stop
          $signature = Get-AuthenticodeSignature -FilePath $setupExe.FullName
          if ($signature.Status -ne "Valid") {
            throw "Setup signature verification failed: $($signature.Status) $($signature.StatusMessage)"
          }

      # After signing: signtool rewrites Setup.exe, so a hash taken earlier would not match the
      # file people download (and installers that verify SHA256SUMS.txt would refuse it).
      - name: Generate release artifact checksums
        shell: powershell
        run: |
          $releasesDir = "dist/windows/releases"
          Get-ChildItem -Path $releasesDir -File | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Add-Content -LiteralPath (Join-Path $releasesDir "SHA256SUMS.txt") -Encoding ascii
          }

      - name: Upload Velopack release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weir-windows-velopack
          if-no-files-found: error
          path: dist/windows/releases/*

  validate:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '-') }}
    timeout-minutes: 90
    # Deliberately no `needs`: none of this touches the Windows package, so it runs
    # while that builds instead of after it.
    permissions:
      contents: read
    env:
      WEIR_SESSION_SECRET: ${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}-release-session-secret-32chars-min
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: apps/server/global.json

      - name: Build Weir server (warnings are errors)
        run: dotnet build apps/server/Weir.slnx -warnaserror

      - name: Test Weir server
        run: dotnet test apps/server/Weir.slnx --no-build

      - name: Server dependency vulnerability scan
        run: node scripts/check-dotnet-vulnerabilities.mjs apps/server/Weir.slnx

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install locked test runner, Playwright browser and ffmpeg
        run: |
          python -m pip install --require-hashes -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Release publication gate ordering
        run: node scripts/check-release-workflow-gates.mjs

      - name: Weir web - install and unit tests
        working-directory: apps/web
        run: |
          npm ci
          npm run api:types:check
          npm run test

      - name: Weir web - production build
        working-directory: apps/web
        env:
          VITE_SUPPORT_URL: ${{ vars.VITE_SUPPORT_URL }}
        run: npm run build

      - name: Pack web dist
        run: |
          cd apps/web
          zip -r "$GITHUB_WORKSPACE/weir-web-dist.zip" dist

      - name: Contract suite, required areas (dotnet)
        id: contract
        env:
          WEIR_CONTRACT_SERVER: dotnet
        run: python -m pytest tests/contract -q --tb=short -p no:cacheprovider --contract-required-only

      # #586: this suite gates publication with no retry, so a flake here fails a tagged release
      # build. The per-server logs the suite already writes (ServerUnderTest.logs_dir,
      # tests/contract/support/launcher.py) live in pytest's basetemp outside the workspace; collect
      # them so a failed release run carries the server-side evidence with it.
      - name: Collect contract server logs
        if: ${{ !cancelled() && steps.contract.outcome == 'failure' }}
        run: |
          shopt -s nullglob globstar
          mkdir -p artifacts/contract-logs
          for log in /tmp/pytest-of-*/pytest-*/**/contract-logs/server-*.log; do
            cp "$log" "artifacts/contract-logs/$(printf '%s' "${log#/tmp/}" | tr '/' '_')"
          done
          ls -la artifacts/contract-logs

      - name: Upload contract server logs
        if: ${{ !cancelled() && steps.contract.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weir-contract-logs
          if-no-files-found: warn
          path: artifacts/contract-logs/*

      - name: Weir E2E smoke (Playwright + real .NET server)
        env:
          WEIR_E2E: "1"
          WEIR_HOME: ${{ runner.temp }}/weir-e2e
        run: python -m pytest tests/e2e/weir -q --tb=short

      - name: Upload web dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weir-web-dist
          if-no-files-found: error
          path: weir-web-dist.zip

  publish:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '-') }}
    timeout-minutes: 120
    # Both gates. Publishing on a green validation but a failed installer would put a
    # Docker image on ghcr for a release that has no Windows build.
    needs: [windows-smoke, validate]
    permissions:
      contents: write
      packages: write
    env:
      WEIR_SESSION_SECRET: ${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}-release-session-secret-32chars-min
      WEIR_LIVE_E2E_FIXTURE_HOST_ROOT: ${{ github.workspace }}/artifacts/docker-release-fixture
      WEIR_LIVE_E2E_FIXTURE_SERVER_ROOT: /e2e-fixture
      WEIR_LIVE_E2E_FFMPEG: ffmpeg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install locked live-audit dependencies and browser
        run: |
          python -m pip install --require-hashes -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Download web dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: weir-web-dist
          path: ${{ github.workspace }}

      - name: Docker image name
        id: image
        run: echo "name=${REGISTRY}/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Normalize tag version
        id: version
        run: echo "plain=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download Velopack release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: weir-windows-velopack
          path: ${{ github.workspace }}/windows-artifact

      # QEMU for the arm64 image's final stage (apt-get). The .NET server is cross-published natively.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build unpushed Docker release candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          platforms: linux/amd64
          push: false
          tags: weir-release-candidate:${{ steps.version.outputs.plain }}

      - name: Start unpushed Docker release candidate
        run: |
          docker rm -f weir-release-candidate >/dev/null 2>&1 || true
          mkdir -p "$WEIR_LIVE_E2E_FIXTURE_HOST_ROOT"
          chmod 0777 "$WEIR_LIVE_E2E_FIXTURE_HOST_ROOT"
          docker run -d --name weir-release-candidate -p 9347:9347 \
            -v "$WEIR_LIVE_E2E_FIXTURE_HOST_ROOT:$WEIR_LIVE_E2E_FIXTURE_SERVER_ROOT" \
            -e WEIR_SESSION_SECRET="$WEIR_SESSION_SECRET" \
            -e WEIR_SESSION_COOKIE_SECURE=false \
            "weir-release-candidate:${{ steps.version.outputs.plain }}"
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:9347/health >/tmp/weir-candidate-health.json; then
              cat /tmp/weir-candidate-health.json
              exit 0
            fi
            sleep 2
          done
          docker logs weir-release-candidate
          exit 1

      - name: Full live E2E against unpushed Docker release candidate
        env:
          WEIR_LIVE_BASE_URL: http://127.0.0.1:9347
          WEIR_LIVE_EXPECTED_VERSION: ${{ steps.version.outputs.plain }}
          WEIR_LIVE_E2E_ARTIFACTS: artifacts/docker-release-candidate-e2e
        run: python scripts/live-packaged-e2e.py

      - name: Upload Docker release-candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weir-docker-release-candidate-audit
          if-no-files-found: warn
          path: artifacts/docker-release-candidate-e2e/*

      - name: Cleanup unpushed Docker release candidate
        if: always()
        run: docker rm -f weir-release-candidate >/dev/null 2>&1 || true

      # The arm64 variant of the same candidate must build before anything is pushed.
      - name: Build unpushed Docker release candidate (linux/arm64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: false
          tags: weir-release-candidate:${{ steps.version.outputs.plain }}-arm64

      # Registry credentials and public tags are not created until the local image
      # has passed the complete packaged browser/API audit above.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.plain }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.plain }}

      - name: Verify published Docker manifest
        run: |
          manifest="$(docker manifest inspect "${{ steps.image.outputs.name }}:latest")"
          echo "$manifest"
          for arch in amd64 arm64; do
            if ! echo "$manifest" | grep -q "\"architecture\": \"$arch\""; then
              echo "::error::The published manifest has no linux/$arch image."
              exit 1
            fi
          done

      - name: Smoke test published Docker image
        run: |
          docker rm -f weir-release-smoke >/dev/null 2>&1 || true
          docker run -d --name weir-release-smoke -p 9347:9347 \
            -e WEIR_SESSION_SECRET="$WEIR_SESSION_SECRET" \
            -e WEIR_SESSION_COOKIE_SECURE=false \
            "${{ steps.image.outputs.name }}:latest"
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:9347/health >/tmp/weir-health.json; then
              cat /tmp/weir-health.json
              exit 0
            fi
            sleep 2
          done
          docker logs weir-release-smoke
          exit 1

      - name: Cleanup Docker smoke container
        if: always()
        run: docker rm -f weir-release-smoke >/dev/null 2>&1 || true

      - name: Prepare user-facing release notes
        run: |
          notes_file="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes_file" ]; then
            echo "::error::Missing required release notes file: $notes_file"
            echo "::error::Create it from docs/release-notes/TEMPLATE.md before tagging."
            exit 1
          fi
          cp "$notes_file" "$GITHUB_WORKSPACE/release-notes.md"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            weir-web-dist.zip
            windows-artifact/*
          body_path: release-notes.md
