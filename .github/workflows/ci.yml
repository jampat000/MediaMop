# MediaMop - backend tests, web build/tests, E2E smoke, Docker smoke, and Windows packaging smoke.
# Triggers: push to main, pull_request, workflow_dispatch.
# GitHub shows the job as "Test / mediamop".
# Keep this step sequence aligned with .github/workflows/release.yml.
name: Test

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mediamop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MEDIAMOP_SESSION_SECRET: ${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}-ci-session-secret-32chars-min
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml

      - name: Install MediaMop backend (editable) + Playwright browser
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./apps/backend[dev]"
          python -m playwright install --with-deps chromium

      - name: MediaMop backend lint
        working-directory: apps/backend
        run: |
          ruff check src tests alembic
          ruff format --check src tests alembic

      - name: Backend security scan (bandit)
        working-directory: apps/backend
        run: bandit -r src -lll -q

      - name: Backend dependency vulnerability scan (pip-audit)
        working-directory: apps/backend
        run: |
          python -m pip freeze --exclude-editable > pip-audit-requirements.txt
          pip-audit --strict -r pip-audit-requirements.txt
          rm pip-audit-requirements.txt

      - name: MediaMop backend type check
        working-directory: apps/backend
        run: mypy src/mediamop

      - name: Run MediaMop backend tests
        working-directory: apps/backend
        env:
          MEDIAMOP_HOME: ${{ runner.temp }}/mediamop-ci
        run: |
          alembic upgrade head
          alembic check
          pytest -q --cov=mediamop --cov-fail-under=70

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: MediaMop agent documentation map
        run: node scripts/check-agent-docs.mjs

      - name: MediaMop web - install, lint, format, build, unit tests
        working-directory: apps/web
        run: |
          npm ci
          npm run api:types:check
          npm run lint
          npm run format
          npm run build
          npm run test

      - name: Frontend dependency vulnerability scan
        working-directory: apps/web
        run: npm audit --audit-level=high

      - name: MediaMop E2E smoke (Playwright + real API)
        env:
          MEDIAMOP_E2E: "1"
          MEDIAMOP_HOME: ${{ runner.temp }}/mediamop-e2e
          PYTHONPATH: ${{ github.workspace }}/apps/backend/src
        run: python -m pytest tests/e2e/mediamop -q --tb=short

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MEDIAMOP_SESSION_SECRET: ${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}-ci-session-secret-32chars-min
    steps:
      - uses: actions/checkout@v7

      - name: Build MediaMop Docker image
        run: docker build -t mediamop-ci-smoke .

      - name: Run MediaMop Docker smoke
        run: |
          docker rm -f mediamop-ci-smoke >/dev/null 2>&1 || true
          docker run -d --name mediamop-ci-smoke -p 8788:8788 \
            -e MEDIAMOP_SESSION_SECRET="$MEDIAMOP_SESSION_SECRET" \
            mediamop-ci-smoke
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8788/health >/tmp/mediamop-health.json; then
              cat /tmp/mediamop-health.json
              exit 0
            fi
            sleep 2
          done
          docker logs mediamop-ci-smoke
          exit 1

      - name: Cleanup MediaMop Docker smoke
        if: always()
        run: docker rm -f mediamop-ci-smoke >/dev/null 2>&1 || true

  windows-package-smoke:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: MediaMop web - install and build
        working-directory: apps/web
        run: |
          npm ci
          npm run api:types:check
          npm run build

      # FFmpeg is ~46% of this job (203.8s of 444.9s measured on v2.4.1) and the
      # vendor folder is gitignored, so every run started from nothing. The key
      # rolls per run and restores the newest previous cache; the build script
      # still checks the vendored copy against the current upstream checksum, so
      # a stale restore is refreshed rather than shipped.
      - name: Cache vendored FFmpeg
        uses: actions/cache@v4
        with:
          path: packaging/windows/vendor/ffmpeg
          key: ffmpeg-vendor-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ffmpeg-vendor-${{ runner.os }}-

      - name: Build MediaMop Windows package (Velopack)
        run: powershell -ExecutionPolicy Bypass -File packaging/windows/build-velopack.ps1

      - name: Smoke test packaged Windows server
        run: powershell -ExecutionPolicy Bypass -File scripts/smoke-windows-package.ps1
