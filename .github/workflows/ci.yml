# Weir - backend tests, web build/tests, E2E smoke, contract suite, Docker smoke, and Windows packaging smoke.
# Triggers: push to main, pull_request, workflow_dispatch.
# Path-aware: the `changes` job decides which parts run. On push to main (a squash merge already
# tested on its pull request) only the backend and web test steps run, and the packaging smokes only
# when packaging, app or workflow files changed.
# GitHub shows the job as "Test / weir".
# Keep this step sequence aligned with .github/workflows/release.yml.
name: Test

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which parts of the repo a change touches, so the jobs below skip work nothing changed.
  # `workflows` counts as touching everything. A manual run (workflow_dispatch) runs everything.
  # The required checks (weir, docker-smoke, windows-package-smoke) keep running as jobs and skip
  # their expensive steps instead, so a skipped check still reports success.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      server: ${{ steps.filter.outputs.server }}
      web: ${{ steps.filter.outputs.web }}
      contract: ${{ steps.filter.outputs.contract }}
      packaging: ${{ steps.filter.outputs.packaging }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name != 'workflow_dispatch'

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - 'tests/**'
              - 'scripts/**'
            server:
              - 'apps/server/**'
            web:
              - 'apps/web/**'
            contract:
              - 'tests/contract/**'
              - 'apps/backend/**'
              - 'apps/server/**'
            packaging:
              - 'packaging/**'
              - 'docker/**'
              - 'Dockerfile'
              - 'compose.yaml'
              - 'apps/tray/**'
              - 'apps/backend/**'
              - 'apps/server/**'
              - 'apps/web/**'
            workflows:
              - '.github/**'

  weir:
    needs: changes
    # Runs even if the change detection failed; the RUN_* flags then default to running everything.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WEIR_SESSION_SECRET: ${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}-ci-session-secret-32chars-min
      # 'true' or 'false'. Web steps also run for backend changes: the web app's generated API
      # types and the E2E smoke depend on the backend.
      RUN_BACKEND: ${{ github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true' }}
      RUN_WEB: ${{ github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.web == 'true' }}
      RUN_WEB_AUDIT: ${{ github.event_name != 'push' && (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.web == 'true' || needs.changes.outputs.workflows == 'true') }}
      RUN_BACKEND_AUDIT: ${{ github.event_name != 'push' && (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true') }}
      RUN_E2E: ${{ github.event_name != 'push' && (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.web == 'true') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Nothing to test for this change
        if: env.RUN_BACKEND != 'true' && env.RUN_WEB != 'true'
        run: echo "No backend, web, test, script or workflow files changed."

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: env.RUN_BACKEND == 'true' || env.RUN_E2E == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend/requirements.lock

      - name: Install locked Weir backend + Playwright browser
        if: env.RUN_BACKEND == 'true' || env.RUN_E2E == 'true'
        run: |
          python -m pip install --require-hashes -r apps/backend/requirements.lock
          python -m pip install --no-deps --no-build-isolation -e "./apps/backend"
          if [ "$RUN_E2E" = "true" ]; then python -m playwright install --with-deps chromium; fi

      - name: Weir backend lint
        if: env.RUN_BACKEND == 'true'
        working-directory: apps/backend
        run: |
          ruff check src tests alembic
          ruff format --check src tests alembic

      - name: Backend security scan (bandit)
        if: env.RUN_BACKEND == 'true'
        working-directory: apps/backend
        run: bandit -r src -lll -q

      - name: Backend dependency vulnerability scan (pip-audit)
        if: env.RUN_BACKEND_AUDIT == 'true'
        working-directory: apps/backend
        run: |
          python -m pip freeze --exclude-editable > pip-audit-requirements.txt
          pip-audit --strict -r pip-audit-requirements.txt
          rm pip-audit-requirements.txt

      - name: Weir backend type check
        if: env.RUN_BACKEND == 'true'
        working-directory: apps/backend
        run: mypy src/weir

      - name: Run Weir backend tests
        if: env.RUN_BACKEND == 'true'
        working-directory: apps/backend
        env:
          WEIR_HOME: ${{ runner.temp }}/weir-ci
        run: |
          alembic upgrade head
          alembic check
          pytest -q --cov=weir --cov-fail-under=75

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: env.RUN_WEB == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Weir agent documentation map
        run: node scripts/check-agent-docs.mjs

      - name: GitHub Actions pin check
        run: node scripts/check-github-action-pins.mjs

      - name: Release publication gate ordering
        run: node scripts/check-release-workflow-gates.mjs

      - name: Weir web - install, lint, format, build, unit tests
        if: env.RUN_WEB == 'true'
        working-directory: apps/web
        run: |
          npm ci
          npm run api:types:check
          npm run lint
          npm run format
          npm run build
          npm run test

      # After the web install above, so it reuses apps/web/node_modules for ts-prune.
      - name: Weir dead-code guard
        if: env.RUN_WEB == 'true'
        run: node scripts/check-dead-code.mjs

      - name: Frontend dependency vulnerability scan
        if: env.RUN_WEB_AUDIT == 'true'
        working-directory: apps/web
        run: npm audit --audit-level=high

      - name: Weir E2E smoke (Playwright + real API)
        if: env.RUN_E2E == 'true'
        env:
          WEIR_E2E: "1"
          WEIR_HOME: ${{ runner.temp }}/weir-e2e
          PYTHONPATH: ${{ github.workspace }}/apps/backend/src
        run: python -m pytest tests/e2e/weir -q --tb=short

  # The C# / .NET 10 server that replaces apps/backend (ADR-0017, #514). Not a required
  # check until the switch-over (#523). Runs only when the server or workflows change.
  weir-server:
    name: weir-server (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.server == 'true' || needs.changes.outputs.workflows == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: apps/server/global.json

      - name: Build Weir server (warnings are errors)
        run: dotnet build apps/server/Weir.slnx -warnaserror

      - name: Test Weir server
        run: dotnet test apps/server/Weir.slnx --no-build

  # Language-neutral contract suite (#516): starts the server under test as a separate process and
  # talks to it only over HTTP (tests/contract/README.md). Not a required check yet.
  # The .NET entry stays commented out until apps/server exists (#515). When it is added, the .NET
  # run may fail per area until that area's port issue is done: areas.json lists, per area, which
  # backends are required, and `--contract-required-only` runs exactly those; the per-area summary
  # at the end of the log shows the rest.
  contract:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.contract == 'true' || needs.changes.outputs.workflows == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        backend: [python]
        # backend: [python, dotnet]
    env:
      WEIR_CONTRACT_SERVER: ${{ matrix.backend }}
      WEIR_SESSION_SECRET: ${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}-ci-session-secret-32chars-min
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend/requirements.lock

      - name: Install locked Weir backend and contract suite dependencies
        run: |
          python -m pip install --require-hashes -r apps/backend/requirements.lock
          python -m pip install --no-deps --no-build-isolation -e "./apps/backend"
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Weir web - install and build (served by the server under test)
        working-directory: apps/web
        run: |
          npm ci
          npm run build

      - name: Contract suite lint
        run: |
          ruff check tests/contract
          ruff format --check tests/contract

      # Every area areas.json marks required for this backend must pass (for python: all of them).
      - name: Contract suite, required areas (${{ matrix.backend }})
        env:
          WEIR_CONTRACT_PYTHON: python
        run: python -m pytest tests/contract -q --tb=short -p no:cacheprovider --contract-required-only

      # The areas not yet ported report pass/fail per area without failing the job.
      - name: Contract suite, all areas report (${{ matrix.backend }})
        if: matrix.backend != 'python'
        continue-on-error: true
        run: python -m pytest tests/contract -q --tb=line -p no:cacheprovider

  docker-smoke:
    needs: changes
    # Runs even if the change detection failed; the RUN_* flags then default to running everything.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUN_PACKAGING: ${{ github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.packaging == 'true' || needs.changes.outputs.workflows == 'true' }}
      WEIR_SESSION_SECRET: ${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}-ci-session-secret-32chars-min
      WEIR_LIVE_E2E_FIXTURE_HOST_ROOT: ${{ github.workspace }}/artifacts/docker-ci-fixture
      WEIR_LIVE_E2E_FIXTURE_SERVER_ROOT: /e2e-fixture
      WEIR_LIVE_E2E_FFMPEG: ffmpeg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Nothing to package for this change
        if: env.RUN_PACKAGING != 'true'
        run: echo "No packaging, app or workflow files changed."

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: env.RUN_PACKAGING == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend/requirements.lock

      - name: Install locked live-audit dependencies and browser
        if: env.RUN_PACKAGING == 'true'
        run: |
          python -m pip install --require-hashes -r apps/backend/requirements.lock
          python -m playwright install --with-deps chromium
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Build Weir Docker image
        if: env.RUN_PACKAGING == 'true'
        run: docker build -t weir-ci-smoke .

      - name: Start Weir Docker candidate
        if: env.RUN_PACKAGING == 'true'
        run: |
          docker rm -f weir-ci-smoke >/dev/null 2>&1 || true
          mkdir -p "$WEIR_LIVE_E2E_FIXTURE_HOST_ROOT"
          chmod 0777 "$WEIR_LIVE_E2E_FIXTURE_HOST_ROOT"
          docker run -d --name weir-ci-smoke -p 8788:8788 \
            -v "$WEIR_LIVE_E2E_FIXTURE_HOST_ROOT:$WEIR_LIVE_E2E_FIXTURE_SERVER_ROOT" \
            -e WEIR_SESSION_SECRET="$WEIR_SESSION_SECRET" \
            -e WEIR_SESSION_COOKIE_SECURE=false \
            weir-ci-smoke
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8788/health >/tmp/weir-health.json; then
              cat /tmp/weir-health.json
              exit 0
            fi
            sleep 2
          done
          docker logs weir-ci-smoke
          exit 1

      - name: Full live E2E against Docker candidate
        if: env.RUN_PACKAGING == 'true'
        env:
          WEIR_LIVE_BASE_URL: http://127.0.0.1:8788
          WEIR_LIVE_E2E_ARTIFACTS: artifacts/docker-ci-e2e
        run: python scripts/live-packaged-e2e.py

      - name: Upload Docker live-audit evidence
        if: always() && env.RUN_PACKAGING == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weir-docker-live-audit
          if-no-files-found: warn
          path: artifacts/docker-ci-e2e/*

      - name: Cleanup Weir Docker smoke
        if: always() && env.RUN_PACKAGING == 'true'
        run: docker rm -f weir-ci-smoke >/dev/null 2>&1 || true

  windows-package-smoke:
    needs: changes
    # Runs even if the change detection failed; the RUN_* flags then default to running everything.
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUN_PACKAGING: ${{ github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.packaging == 'true' || needs.changes.outputs.workflows == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Nothing to package for this change
        if: env.RUN_PACKAGING != 'true'
        run: echo "No packaging, app or workflow files changed."

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: env.RUN_PACKAGING == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend/requirements.lock

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: env.RUN_PACKAGING == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: env.RUN_PACKAGING == 'true'
        with:
          dotnet-version: "9.0.x"

      - name: Weir tray unit tests
        if: env.RUN_PACKAGING == 'true'
        run: dotnet test apps/tray/Weir.Tray.Tests --nologo --verbosity quiet

      - name: Install Velopack CLI
        if: env.RUN_PACKAGING == 'true'
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Weir web - install and build
        if: env.RUN_PACKAGING == 'true'
        working-directory: apps/web
        run: |
          npm ci
          npm run api:types:check
          npm run build

      # FFmpeg is ~46% of this job (203.8s of 444.9s measured on v2.4.1) and the
      # vendor folder is gitignored, so every run started from nothing. The key
      # rolls per run and restores the newest previous cache; the build script
      # still checks the vendored copy against the current upstream checksum, so
      # a stale restore is refreshed rather than shipped.
      - name: Cache vendored FFmpeg
        if: env.RUN_PACKAGING == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: packaging/windows/vendor/ffmpeg
          key: ffmpeg-vendor-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ffmpeg-vendor-${{ runner.os }}-

      - name: Build Weir Windows package (Velopack)
        if: env.RUN_PACKAGING == 'true'
        run: powershell -ExecutionPolicy Bypass -File packaging/windows/build-velopack.ps1

      - name: Smoke test packaged Windows server
        if: env.RUN_PACKAGING == 'true'
        run: powershell -ExecutionPolicy Bypass -File scripts/smoke-windows-package.ps1
