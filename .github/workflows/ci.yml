# Weir - .NET server build and tests, web build/tests, E2E smoke, contract suite, Docker smoke, and
# Windows packaging smoke.
# Triggers: push to main, pull_request, workflow_dispatch.
# Path-aware: the `changes` job decides which parts run. On push to main (a squash merge already
# tested on its pull request) only the build and unit test steps run, and the packaging smokes only
# when packaging, app or workflow files changed.
# GitHub shows the job as "Test / weir".
# Keep this step sequence aligned with .github/workflows/release.yml.
name: Test

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  # Which parts of the repo a change touches, so the jobs below skip work nothing changed.
  # `workflows` counts as touching everything. A manual run (workflow_dispatch) runs everything.
  # The required checks (weir, docker-smoke, windows-package-smoke) keep running as jobs and skip
  # their expensive steps instead, so a skipped check still reports success.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      server: ${{ steps.filter.outputs.server }}
      web: ${{ steps.filter.outputs.web }}
      harness: ${{ steps.filter.outputs.harness }}
      contract: ${{ steps.filter.outputs.contract }}
      packaging: ${{ steps.filter.outputs.packaging }}
      docker: ${{ steps.filter.outputs.docker }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name != 'workflow_dispatch'

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            server:
              - 'apps/server/**'
            web:
              - 'apps/web/**'
            harness:
              - 'tests/**'
              - 'scripts/**'
              - 'pytest.ini'
            contract:
              - 'tests/contract/**'
              - 'tests/e2e/weir/_runtime.py'
              - 'tests/requirements.txt'
              - 'apps/server/**'
            packaging:
              - 'packaging/**'
              - 'docker/**'
              - 'Dockerfile'
              - '.dockerignore'
              - 'compose.yaml'
              - 'apps/tray/**'
              - 'apps/server/**'
              - 'apps/web/**'
              - 'scripts/smoke-windows-package.ps1'
              - 'scripts/live-packaged-e2e.py'
            docker:
              - 'docker/**'
              - 'Dockerfile'
              - '.dockerignore'
            workflows:
              - '.github/**'

  weir:
    needs: changes
    # Runs even if the change detection failed; the RUN_* flags then default to running everything.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WEIR_SESSION_SECRET: ${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}-ci-session-secret-32chars-min
      # 'true' or 'false'. Web steps also run for server changes: the server embeds the committed
      # OpenAPI document the web app's generated types come from, and the E2E smoke needs both.
      RUN_SERVER: ${{ github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.server == 'true' || needs.changes.outputs.workflows == 'true' }}
      RUN_WEB: ${{ github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.server == 'true' || needs.changes.outputs.harness == 'true' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.web == 'true' }}
      RUN_WEB_AUDIT: ${{ github.event_name != 'push' && (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.web == 'true' || needs.changes.outputs.workflows == 'true') }}
      RUN_SERVER_AUDIT: ${{ github.event_name != 'push' && (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.server == 'true' || needs.changes.outputs.workflows == 'true') }}
      RUN_E2E: ${{ github.event_name != 'push' && (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.server == 'true' || needs.changes.outputs.harness == 'true' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.web == 'true') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Nothing to test for this change
        if: env.RUN_SERVER != 'true' && env.RUN_WEB != 'true'
        run: echo "No server, web, test, script or workflow files changed."

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: env.RUN_SERVER == 'true' || env.RUN_E2E == 'true'
        with:
          global-json-file: apps/server/global.json

      # Warnings are errors, and so are the unused-member analyzers (IDE0051/IDE0052, apps/server/.editorconfig):
      # that is the server's dead-code guard.
      - name: Build Weir server (warnings are errors)
        if: env.RUN_SERVER == 'true' || env.RUN_E2E == 'true'
        run: dotnet build apps/server/Weir.slnx -warnaserror

      - name: Test Weir server
        if: env.RUN_SERVER == 'true'
        run: dotnet test apps/server/Weir.slnx --no-build

      - name: Server dependency vulnerability scan
        if: env.RUN_SERVER_AUDIT == 'true'
        run: node scripts/check-dotnet-vulnerabilities.mjs apps/server/Weir.slnx

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: env.RUN_WEB == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Weir agent documentation map
        run: node scripts/check-agent-docs.mjs

      - name: GitHub Actions pin check
        run: node scripts/check-github-action-pins.mjs

      - name: Release publication gate ordering
        run: node scripts/check-release-workflow-gates.mjs

      - name: Weir web - install, lint, format, build, unit tests
        if: env.RUN_WEB == 'true'
        working-directory: apps/web
        run: |
          npm ci
          npm run api:types:check
          npm run lint
          npm run format
          npm run build
          npm run test

      # After the web install above, so it reuses apps/web/node_modules for ts-prune.
      - name: Weir dead-code guard
        if: env.RUN_WEB == 'true'
        run: node scripts/check-dead-code.mjs

      - name: Frontend dependency vulnerability scan
        if: env.RUN_WEB_AUDIT == 'true'
        working-directory: apps/web
        run: npm audit --audit-level=high

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: env.RUN_E2E == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install locked test runner + Playwright browser
        if: env.RUN_E2E == 'true'
        run: |
          python -m pip install --require-hashes -r tests/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Weir E2E smoke (Playwright + real .NET server)
        if: env.RUN_E2E == 'true'
        env:
          WEIR_E2E: "1"
          WEIR_HOME: ${{ runner.temp }}/weir-e2e
        run: python -m pytest tests/e2e/weir -q --tb=short

  # The server's Windows-only code paths (file identity, same-folder renames, sharing violations) only
  # run on Windows. Not a required check; runs when the server or the workflows change.
  weir-server-windows:
    name: weir-server (windows-latest)
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.server == 'true' || needs.changes.outputs.workflows == 'true') }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: apps/server/global.json

      - name: Build Weir server (warnings are errors)
        run: dotnet build apps/server/Weir.slnx -warnaserror

      - name: Test Weir server
        run: dotnet test apps/server/Weir.slnx --no-build

  # Language-neutral contract suite (#516): starts the .NET server as a separate process and talks to
  # it only over HTTP (tests/contract/README.md). areas.json requires every area on dotnet.
  contract:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.contract == 'true' || needs.changes.outputs.workflows == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        backend: [dotnet]
    env:
      WEIR_CONTRACT_SERVER: ${{ matrix.backend }}
      WEIR_SESSION_SECRET: ${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}-ci-session-secret-32chars-min
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install locked contract suite dependencies and ffmpeg
        run: |
          python -m pip install --require-hashes -r tests/requirements.txt
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: apps/server/global.json

      - name: Build Weir server (the server under test)
        run: dotnet build apps/server/Weir.slnx

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Weir web - install and build (served by the server under test)
        working-directory: apps/web
        run: |
          npm ci
          npm run build

      - name: Contract suite lint
        run: |
          ruff check tests/contract
          ruff format --check tests/contract

      # Every area areas.json marks required for this server must pass (for dotnet: all of them).
      - name: Contract suite, required areas (${{ matrix.backend }})
        run: python -m pytest tests/contract -q --tb=short -p no:cacheprovider --contract-required-only

  docker-smoke:
    needs: changes
    # Runs even if the change detection failed; the RUN_* flags then default to running everything.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUN_PACKAGING: ${{ github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.packaging == 'true' || needs.changes.outputs.workflows == 'true' }}
      # The arm64 image is built under QEMU, which is slow, so only when the image definition itself
      # changed (or on a manual run). Releases always build and publish both architectures.
      RUN_ARM64: ${{ github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.docker == 'true' }}
      WEIR_SESSION_SECRET: ${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}-ci-session-secret-32chars-min
      WEIR_LIVE_E2E_FIXTURE_HOST_ROOT: ${{ github.workspace }}/artifacts/docker-ci-fixture
      WEIR_LIVE_E2E_FIXTURE_SERVER_ROOT: /e2e-fixture
      WEIR_LIVE_E2E_FFMPEG: ffmpeg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Nothing to package for this change
        if: env.RUN_PACKAGING != 'true'
        run: echo "No packaging, app or workflow files changed."

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: env.RUN_PACKAGING == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install locked live-audit dependencies and browser
        if: env.RUN_PACKAGING == 'true'
        run: |
          python -m pip install --require-hashes -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Build Weir Docker image
        if: env.RUN_PACKAGING == 'true'
        run: docker build -t weir-ci-smoke .

      - name: Start Weir Docker candidate
        if: env.RUN_PACKAGING == 'true'
        run: |
          docker rm -f weir-ci-smoke >/dev/null 2>&1 || true
          mkdir -p "$WEIR_LIVE_E2E_FIXTURE_HOST_ROOT"
          chmod 0777 "$WEIR_LIVE_E2E_FIXTURE_HOST_ROOT"
          docker run -d --name weir-ci-smoke -p 8788:8788 \
            -v "$WEIR_LIVE_E2E_FIXTURE_HOST_ROOT:$WEIR_LIVE_E2E_FIXTURE_SERVER_ROOT" \
            -e WEIR_SESSION_SECRET="$WEIR_SESSION_SECRET" \
            -e WEIR_SESSION_COOKIE_SECURE=false \
            weir-ci-smoke
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8788/health >/tmp/weir-health.json; then
              cat /tmp/weir-health.json
              exit 0
            fi
            sleep 2
          done
          docker logs weir-ci-smoke
          exit 1

      # #548: the writer setting's "best" default degrades to ffmpeg without complaint when mkvmerge is
      # missing, so an image that quietly stopped installing it would pass every other step here. This
      # asserts the binary is in the image and runs at all; the live E2E below reads
      # /api/v1/system/media-tools, which proves the endpoint answers in a real deployment.
      - name: Docker candidate carries mkvmerge
        if: env.RUN_PACKAGING == 'true'
        run: |
          version="$(docker exec weir-ci-smoke mkvmerge --version | head -n 1)"
          case "$version" in
            mkvmerge\ *) echo "Docker image carries $version" ;;
            *) echo "The Docker image did not report a usable mkvmerge: $version" >&2; exit 1 ;;
          esac

      - name: Full live E2E against Docker candidate
        if: env.RUN_PACKAGING == 'true'
        env:
          WEIR_LIVE_BASE_URL: http://127.0.0.1:8788
          WEIR_LIVE_E2E_ARTIFACTS: artifacts/docker-ci-e2e
        run: python scripts/live-packaged-e2e.py

      - name: Upload Docker live-audit evidence
        if: always() && env.RUN_PACKAGING == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weir-docker-live-audit
          if-no-files-found: warn
          path: artifacts/docker-ci-e2e/*

      - name: Cleanup Weir Docker smoke
        if: always() && env.RUN_PACKAGING == 'true'
        run: docker rm -f weir-ci-smoke >/dev/null 2>&1 || true

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        if: env.RUN_PACKAGING == 'true' && env.RUN_ARM64 == 'true'
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        if: env.RUN_PACKAGING == 'true' && env.RUN_ARM64 == 'true'

      # The server itself is cross-published natively in the SDK stage; only the final stage's apt-get
      # runs emulated. Proves the multi-arch image the release publishes still builds.
      - name: Build Weir Docker image (linux/arm64)
        if: env.RUN_PACKAGING == 'true' && env.RUN_ARM64 == 'true'
        run: docker buildx build --platform linux/arm64 -t weir-ci-smoke:arm64 .

  windows-package-smoke:
    needs: changes
    # Runs even if the change detection failed; the RUN_* flags then default to running everything.
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUN_PACKAGING: ${{ github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.packaging == 'true' || needs.changes.outputs.workflows == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Nothing to package for this change
        if: env.RUN_PACKAGING != 'true'
        run: echo "No packaging, app or workflow files changed."

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: env.RUN_PACKAGING == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # .NET 10 for the server (apps/server/global.json), .NET 9 for the tray app it ships with.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: env.RUN_PACKAGING == 'true'
        with:
          dotnet-version: "9.0.x"
          global-json-file: apps/server/global.json

      - name: Weir tray unit tests
        if: env.RUN_PACKAGING == 'true'
        run: dotnet test apps/tray/Weir.Tray.Tests --nologo --verbosity quiet

      - name: Install Velopack CLI
        if: env.RUN_PACKAGING == 'true'
        run: dotnet tool install -g vpk --version 1.2.0

      # FFmpeg is ~46% of this job (203.8s of 444.9s measured on v2.4.1) and the
      # vendor folder is gitignored, so every run started from nothing. The key
      # rolls per run and restores the newest previous cache; the build script
      # still checks the vendored copy against the current upstream checksum, so
      # a stale restore is refreshed rather than shipped.
      - name: Cache vendored FFmpeg
        if: env.RUN_PACKAGING == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: packaging/windows/vendor/ffmpeg
          key: ffmpeg-vendor-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ffmpeg-vendor-${{ runner.os }}-

      # #548: same reasoning as FFmpeg above — an ~85 MB download the gitignored vendor folder would
      # otherwise repeat every run. The key carries the pinned version, so bumping
      # $mkvtoolnixVersion in build-velopack.ps1 misses the cache and downloads the new archive
      # rather than restoring the old one; the build script re-checks the vendored copy against the
      # pinned checksum either way.
      - name: Cache vendored MKVToolNix
        if: env.RUN_PACKAGING == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: packaging/windows/vendor/mkvtoolnix
          key: mkvtoolnix-vendor-${{ runner.os }}-${{ hashFiles('packaging/windows/build-velopack.ps1') }}
          restore-keys: |
            mkvtoolnix-vendor-${{ runner.os }}-

      # Builds the web app, publishes the .NET server and the tray, vendors FFmpeg and MKVToolNix and packs.
      - name: Build Weir Windows package (Velopack)
        if: env.RUN_PACKAGING == 'true'
        run: powershell -ExecutionPolicy Bypass -File packaging/windows/build-velopack.ps1

      - name: Smoke test packaged Windows server
        if: env.RUN_PACKAGING == 'true'
        run: powershell -ExecutionPolicy Bypass -File scripts/smoke-windows-package.ps1
