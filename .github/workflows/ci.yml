# MediaMop - backend tests, web build/tests, E2E smoke, Docker smoke, and Windows packaging smoke.
# Triggers: push to main, pull_request, workflow_dispatch.
# GitHub shows the job as "Test / mediamop".
# Keep this step sequence aligned with .github/workflows/release.yml.
name: Test

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mediamop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MEDIAMOP_SESSION_SECRET: ${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}-ci-session-secret-32chars-min
      MEDIAMOP_LIVE_E2E_FIXTURE_HOST_ROOT: ${{ runner.temp }}/mediamop-docker-ci-fixture
      MEDIAMOP_LIVE_E2E_FIXTURE_SERVER_ROOT: /e2e-fixture
      MEDIAMOP_LIVE_E2E_FFMPEG: ffmpeg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend/requirements.lock

      - name: Install locked MediaMop backend + Playwright browser
        run: |
          python -m pip install --require-hashes -r apps/backend/requirements.lock
          python -m pip install --no-deps --no-build-isolation -e "./apps/backend"
          python -m playwright install --with-deps chromium

      - name: MediaMop backend lint
        working-directory: apps/backend
        run: |
          ruff check src tests alembic
          ruff format --check src tests alembic

      - name: Backend security scan (bandit)
        working-directory: apps/backend
        run: bandit -r src -lll -q

      - name: Backend dependency vulnerability scan (pip-audit)
        working-directory: apps/backend
        run: |
          python -m pip freeze --exclude-editable > pip-audit-requirements.txt
          pip-audit --strict -r pip-audit-requirements.txt
          rm pip-audit-requirements.txt

      - name: MediaMop backend type check
        working-directory: apps/backend
        run: mypy src/mediamop

      - name: Run MediaMop backend tests
        working-directory: apps/backend
        env:
          MEDIAMOP_HOME: ${{ runner.temp }}/mediamop-ci
        run: |
          alembic upgrade head
          alembic check
          pytest -q --cov=mediamop --cov-fail-under=75

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: MediaMop agent documentation map
        run: node scripts/check-agent-docs.mjs

      - name: GitHub Actions pin check
        run: node scripts/check-github-action-pins.mjs

      - name: Release publication gate ordering
        run: node scripts/check-release-workflow-gates.mjs

      - name: MediaMop web - install, lint, format, build, unit tests
        working-directory: apps/web
        run: |
          npm ci
          npm run api:types:check
          npm run lint
          npm run format
          npm run build
          npm run test

      # After the web install above, so it reuses apps/web/node_modules for ts-prune.
      - name: MediaMop dead-code guard
        run: node scripts/check-dead-code.mjs

      - name: Frontend dependency vulnerability scan
        working-directory: apps/web
        run: npm audit --audit-level=high

      - name: MediaMop E2E smoke (Playwright + real API)
        env:
          MEDIAMOP_E2E: "1"
          MEDIAMOP_HOME: ${{ runner.temp }}/mediamop-e2e
          PYTHONPATH: ${{ github.workspace }}/apps/backend/src
        run: python -m pytest tests/e2e/mediamop -q --tb=short

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MEDIAMOP_SESSION_SECRET: ${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}-ci-session-secret-32chars-min
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend/requirements.lock

      - name: Install locked live-audit dependencies and browser
        run: |
          python -m pip install --require-hashes -r apps/backend/requirements.lock
          python -m playwright install --with-deps chromium
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Build MediaMop Docker image
        run: docker build -t mediamop-ci-smoke .

      - name: Start MediaMop Docker candidate
        run: |
          docker rm -f mediamop-ci-smoke >/dev/null 2>&1 || true
          mkdir -p "$MEDIAMOP_LIVE_E2E_FIXTURE_HOST_ROOT"
          chmod 0777 "$MEDIAMOP_LIVE_E2E_FIXTURE_HOST_ROOT"
          docker run -d --name mediamop-ci-smoke -p 8788:8788 \
            -v "$MEDIAMOP_LIVE_E2E_FIXTURE_HOST_ROOT:$MEDIAMOP_LIVE_E2E_FIXTURE_SERVER_ROOT" \
            -e MEDIAMOP_SESSION_SECRET="$MEDIAMOP_SESSION_SECRET" \
            -e MEDIAMOP_SESSION_COOKIE_SECURE=false \
            mediamop-ci-smoke
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8788/health >/tmp/mediamop-health.json; then
              cat /tmp/mediamop-health.json
              exit 0
            fi
            sleep 2
          done
          docker logs mediamop-ci-smoke
          exit 1

      - name: Full live E2E against Docker candidate
        env:
          MEDIAMOP_LIVE_BASE_URL: http://127.0.0.1:8788
          MEDIAMOP_LIVE_E2E_ARTIFACTS: artifacts/docker-ci-e2e
        run: python scripts/live-packaged-e2e.py

      - name: Upload Docker live-audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mediamop-docker-live-audit
          if-no-files-found: warn
          path: artifacts/docker-ci-e2e/*

      - name: Cleanup MediaMop Docker smoke
        if: always()
        run: docker rm -f mediamop-ci-smoke >/dev/null 2>&1 || true

  windows-package-smoke:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend/requirements.lock

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "9.0.x"

      - name: MediaMop tray unit tests
        run: dotnet test apps/tray/MediaMop.Tray.Tests --nologo --verbosity quiet

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: MediaMop web - install and build
        working-directory: apps/web
        run: |
          npm ci
          npm run api:types:check
          npm run build

      # FFmpeg is ~46% of this job (203.8s of 444.9s measured on v2.4.1) and the
      # vendor folder is gitignored, so every run started from nothing. The key
      # rolls per run and restores the newest previous cache; the build script
      # still checks the vendored copy against the current upstream checksum, so
      # a stale restore is refreshed rather than shipped.
      - name: Cache vendored FFmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: packaging/windows/vendor/ffmpeg
          key: ffmpeg-vendor-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ffmpeg-vendor-${{ runner.os }}-

      - name: Build MediaMop Windows package (Velopack)
        run: powershell -ExecutionPolicy Bypass -File packaging/windows/build-velopack.ps1

      - name: Smoke test packaged Windows server
        run: powershell -ExecutionPolicy Bypass -File scripts/smoke-windows-package.ps1
