# Grouped updates match Dependabot PR titles like "bump the pip group" / "bump the actions group".
version: 2
updates:
  - package-ecosystem: pip
    directory: /apps/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pip:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

  # apps/web is the shipped frontend. It was missing while docs-site was covered, so the
  # marketing site got dependency PRs and the product did not. CI's `npm audit
  # --audit-level=high` runs here too, but that only fails a build after the fact and
  # ignores moderate severities — it does not open a PR to fix anything.
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Keep unsupported toolchain majors quiet until their peer ecosystem catches up.
    # eslint-plugin-jsx-a11y 6.10.2 rejects ESLint 10, while openapi-typescript 7.13.0
    # supports TypeScript 5.x only. Dependabot will resume these automatically
    # when the bounds below are deliberately revised with the corresponding migration.
    ignore:
      - dependency-name: "eslint"
        versions:
          - ">=10.0.0"
      - dependency-name: "@eslint/js"
        versions:
          - ">=10.0.0"
      - dependency-name: "typescript"
        versions:
          - ">=6.0.0"

  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docs-site:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Docusaurus 3.10.2 still inherits the removed baseUrl compiler option,
    # so its published tsconfig cannot be typechecked by TypeScript 7 yet.
    ignore:
      - dependency-name: "typescript"
        versions:
          - ">=7.0.0"

  # The tray ships in the Windows installer and had no ecosystem entry at all, so Velopack
  # and the test project's xunit packages were unmonitored. One directory each: Dependabot
  # resolves NuGet per project file, and there is no .sln to cover both.
  - package-ecosystem: nuget
    directory: /apps/tray/Weir.Tray
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tray:
        patterns:
          - "*"

  - package-ecosystem: nuget
    directory: /apps/tray/Weir.Tray.Tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tray-tests:
        patterns:
          - "*"
