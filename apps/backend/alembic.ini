# Alembic — Weir backend (SQLite-first).
# Runtime URL comes from WeirSettings in env.py (WEIR_HOME / WEIR_DB_PATH).

[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
version_path_separator = os

sqlalchemy.url = sqlite:///%(here)s/data/weir.sqlite3

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
