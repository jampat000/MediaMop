[pytest]
# E2E and any repo-root ``pytest tests/...`` runs must resolve ``weir`` (``apps/backend`` uses
# ``pythonpath = src`` only when pytest's rootdir is ``apps/backend``).
pythonpath =
    apps/backend/src
markers =
    weir_e2e: Weir React/API spine smoke (opt-in: WEIR_E2E=1; see tests/e2e/weir/)
